name: Keep Render Backend Warm

on:
  schedule:
    # Every 5 minutes — Render free tier spins down after ~15 min idle,
    # so a ping every 5 min keeps the API warm for the live demo.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          echo "Pinging backend health check endpoint..."
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 https://commerceflow-api-1s7i.onrender.com/api/healthz || echo "000")
          echo "Initial healthz status: $code"
          
          if [ "$code" != "200" ]; then
            echo "Cold-start or delay detected. Waiting 10s before retry..."
            sleep 10
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 https://commerceflow-api-1s7i.onrender.com/api/healthz || echo "000")
            echo "Retry healthz status: $code"
          fi

          if [ "$code" = "200" ]; then
            echo "✅ Backend is warm and responsive (status: 200)"
          else
            echo "⚠️ Backend ping returned status: $code"
            # Exit 0 so GitHub Actions scheduler does not send failure email alerts for transient free-tier cold starts
            exit 0
          fi
