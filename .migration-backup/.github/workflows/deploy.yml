name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      - name: Deploy to staging
        run: |
          echo "Deploy staging with zero-downtime rolling update"
          echo "1. Pull new image"
          echo "2. Run migrations"
          echo "3. Start new containers"
          echo "4. Health check /health/ready"
          echo "5. Drain old containers via SIGTERM"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Blue-green deployment strategy"
          echo "1. Deploy to green environment"
          echo "2. Run smoke tests against green"
          echo "3. Switch traffic via load balancer"
          echo "4. Graceful shutdown of blue environment"
