apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerceflow-api
  labels:
    app: commerceflow-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: commerceflow-api
  template:
    metadata:
      labels:
        app: commerceflow-api
    spec:
      containers:
        - name: api
          image: commerceflow-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: commerceflow-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerceflow-worker
  labels:
    app: commerceflow-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: commerceflow-worker
  template:
    metadata:
      labels:
        app: commerceflow-worker
    spec:
      containers:
        - name: worker
          image: commerceflow-api:latest
          command: ["node", "dist/workers/index.js"]
          envFrom:
            - secretRef:
                name: commerceflow-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: commerceflow-api
spec:
  selector:
    app: commerceflow-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commerceflow-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commerceflow-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
