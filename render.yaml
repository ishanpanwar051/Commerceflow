# Render blueprint for CommerceFlow (pnpm workspace monorepo)
# Deploy: Express API (backend/) + Vite/React frontend (frontend/)
#
# IMPORTANT: rootDir is the repo root (.) for BOTH services so that Render
# detects pnpm-lock.yaml and uses pnpm. npm cannot resolve the pnpm `catalog:`
# protocol used across this workspace and fails with EUNSUPPORTEDPROTOCOL.
#
# DATABASE: Render's free tier allows only ONE free Postgres instance per
# workspace. If you already have a free Postgres (e.g. from url-shortener),
# reuse it instead of creating a new one here. RECOMMENDED (clean):
#   a) Create a NEW logical database on that same instance and point to it:
#        psql "$<EXISTING_CONNECTION_STRING>" -c "CREATE DATABASE commerceflow;"
#        then use the same connection string but ending in /commerceflow
#      (Avoid pointing directly at the existing app's database: `prisma db push`
#       in the build would fail on tables it doesn't know about.)
#   DATABASE_URL is `sync: false`. NOTE: Render only prompts for sync:false
#   values during INITIAL Blueprint creation — if you already created this
#   Blueprint once, delete it and recreate, or set DATABASE_URL manually in
#   the backend service's Environment tab. Get the string from the existing
#   Postgres -> Connections tab. NOTE: the Internal URL only works if the DB
#   is in the same region as the backend (oregon) — otherwise use the External
#   URL.
#
# How to use:
#   1. Push this file to GitHub
#   2. Go to https://render.com -> New -> Blueprint
#   3. Select the CommerceFlow repository -> Apply Blueprint
#   4. When prompted, paste the DATABASE_URL (from your existing free Postgres).
#   5. After first deploy, set optional env vars (Stripe, Cloudinary, SMTP,
#      Google OAuth) in the "Environment" tab of the backend service, then
#      Deploy again.

services:
  # ============================================
  # BACKEND: Express + TypeScript + Prisma API
  # ============================================
  - type: web
    name: commerceflow-api
    runtime: node
    plan: free
    region: oregon
    # Repo root (not backend/) so Render sees pnpm-lock.yaml and uses pnpm.
    rootDir: .
    # Install + build from the monorepo root, then generate Prisma client and push schema.
    # NOTE: preDeployCommand is not available on the free tier, so DB setup runs in buildCommand.
    # Plain filter (no `...`) matches the proven Dockerfile build: the lib packages are
    # bundled from source by esbuild/Vite, so they don't need their own build step.
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/api-server exec prisma generate && pnpm --filter @workspace/api-server exec prisma db push && cd backend && npx esbuild src/auto-fix-database.ts --bundle --platform=node --outfile=dist/auto-fix-database.mjs --format=esm --external:@prisma/client --external:@prisma/adapter-pg --external:pg
    startCommand: node ./backend/dist/auto-fix-database.mjs && node ./backend/dist/update-images.mjs && node --enable-source-maps ./backend/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Reuse the workspace's single free-tier Postgres (see header comment).
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://commerceflow-frontend-5c7v.onrender.com
      - key: GOOGLE_CLIENT_ID
        # TODO: replace with the REAL "Web client ID" from Firebase console ->
        # Authentication -> Sign-in method -> Google (project commerceflow-7cfd1).
        sync: false
      - key: STRIPE_SECRET_KEY
        # Set manually in the dashboard (Render -> commerceflow-api-1s7i ->
        # Environment) so it is never committed to the repository.
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ============================================
  # FRONTEND: Vite / React static site
  # ============================================
  - type: web
    name: commerceflow-frontend
    runtime: static
    # Repo root (not frontend/) so Render sees pnpm-lock.yaml and uses pnpm.
    rootDir: .
    # Plain filter (no `...`) matches the proven Dockerfile frontend build.
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @workspace/commerce-flow run build
    staticPublishPath: ./frontend/dist/public
    # SPA fallback: serve index.html for all client-side routes (e.g. /login).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Build-time variable. If the backend URL differs, update this in the dashboard.
      - key: VITE_API_URL
        value: https://commerceflow-api-1s7i.onrender.com/api/v1
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: pk_test_51TxmtXDYRQrOBbz8GwtTBuQ87jxLS64rIfzlhWpE4rPNo2C8J2GZAVY7MeFoHABVknT3T6oYH1MvMqK6XDasVYO800eWEY0r3M
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBzySXDWLn1yfF1ONz0I4PtWJE_dF6Aki4
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: commerceflow-7cfd1.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: commerceflow-7cfd1
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: commerceflow-7cfd1.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
